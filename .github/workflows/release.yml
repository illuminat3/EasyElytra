name: Build and Release Minecraft Mod

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Install dos2unix
      run: sudo apt-get install dos2unix

    - name: Convert line endings
      run: dos2unix gradlew

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build the mod
      run: ./gradlew build

    - name: List build directory
      run: ls -R build/libs

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-artifact
        path: build/libs/*.jar
        if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: mod-artifact
        path: artifacts

    - name: List downloaded artifacts
      run: ls -R artifacts

    - name: Read the Minecraft version
      run: |
        MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d '=' -f2 | tr -d '[:space:]')
        if [ -z "$MC_VERSION" ]; then
          echo "minecraft_version not found in gradle.properties" >&2
          exit 1
        fi
        echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.MC_VERSION }}
        name: Easy Elytra ${{ env.MC_VERSION }}
        draft: true
        prerelease: false
        files: artifacts/*.jar
        fail_on_unmatched_files: true
